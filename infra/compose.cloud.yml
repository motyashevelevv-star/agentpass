# Managed cloud build trust. Uses a combined public CA bundle without retaining it in layers.
services:
  api:
    build:
      secrets: [proxy_ca]
  worker:
    build:
      secrets: [proxy_ca]
  web:
    build:
      secrets: [proxy_ca]
secrets:
  proxy_ca:
    file: /etc/ssl/certs/ca-certificates.crt
